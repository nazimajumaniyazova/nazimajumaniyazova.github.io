# Runs on every push and pull request: formatting, ESLint, HTML validation,
# the Sass build, and a check that the committed CSS matches the Sass source.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Committed CSS is up to date
        run: git diff --exit-code -- src/css/main.css
